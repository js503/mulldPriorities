<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;overflow:hidden;background:#090b0c}</style></head><body><div id="mulld-frames"  aria-label="Warm corner framing variations">

<section data-variant="Cinema edition"><div class="mf-frame mf-cinema" aria-label="Cinema edition"><div class="mf-art"></div><div class="mf-trim"></div><span class="mf-label">mulld / RIMWORLD MODS</span><span class="mf-footer">COLONY NEEDS. USEFUL WORK. YOUR APPROVAL.</span></div></section>



</div>
<template id="mf-original"><div class="mm-cover mm-warm"><div class="mm-grid"><img class="mm-real" alt="Real in-game work priorities"></div><header><b>mulld</b><h2>Priorities</h2></header><img class="mm-pawn" alt="Asian mulld mascot with visible legs in an open black bomber jacket over a white shirt stirring mulled wine"><small>A LITTLE ORDER. A BETTER COLONY.</small></div></template>
<style>
#mulld-frames .mm-cover{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;container-type:inline-size;background:#14191c;color:#ece6d8;font-family:Arial,sans-serif}
#mulld-frames header{position:absolute;z-index:3;left:5%;top:7%}
#mulld-frames b{font:700 4.4cqw/1 Arial;letter-spacing:-.22cqw}
#mulld-frames h2{font:400 7.4cqw/1.05 Georgia;margin:.8cqw 0 0;color:#e3c68a;letter-spacing:-.25cqw}
#mulld-frames .mm-grid{position:absolute;inset:0 0 0 29%;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 40%);opacity:.85}
#mulld-frames .mm-real{position:absolute;width:155%;max-width:none;left:0;bottom:-6%;height:auto}
#mulld-frames .mm-pawn{position:absolute;z-index:2;width:28%;height:auto;left:4%;bottom:4%;filter:drop-shadow(0 1cqw 1.3cqw #0005)}
#mulld-frames small{position:absolute;z-index:4;font:400 .9cqw/1.3 Arial;letter-spacing:.15cqw;color:#baad91;left:5%;bottom:3%}
#mulld-frames .mm-maker .mm-pawn{bottom:8%;width:25%;left:4%}
#mulld-frames .mm-signature header{left:5%;top:9%}
#mulld-frames .mm-signature b{font-size:6cqw}
#mulld-frames .mm-signature h2{font:400 5cqw/1.1 Arial;letter-spacing:-.15cqw}
#mulld-frames .mm-signature .mm-pawn{width:19%;left:5%;bottom:12%}
#mulld-frames .mm-signature .mm-grid{left:19%;mask-image:linear-gradient(90deg,transparent,#000 48%)}
#mulld-frames .mm-signature small{bottom:7%}
#mulld-frames .mm-warm{background:radial-gradient(ellipse at 16% 78%,#473023 0%,#14191c 44%)}
#mulld-frames .mm-warm header{left:5%;top:6%;display:flex;align-items:baseline;gap:2.2cqw}
#mulld-frames .mm-warm h2{font-size:5.8cqw}
#mulld-frames .mm-warm .mm-grid{top:22%;left:22%;mask-image:linear-gradient(90deg,transparent,#000 47%)}
#mulld-frames .mm-warm .mm-real{width:142%;bottom:-8%}
#mulld-frames .mm-warm .mm-pawn{width:30%;left:1%;bottom:7%}
#mulld-frames .mm-host header{left:5%;top:7%}
#mulld-frames .mm-host h2{font-size:6.8cqw}
#mulld-frames .mm-host .mm-pawn{left:-2%;width:33%;bottom:-8%}
#mulld-frames .mm-host .mm-grid{left:30%;mask-image:linear-gradient(90deg,transparent,#000 26%)}
#mulld-frames .mm-host small{left:auto;right:4%;bottom:4%}
#mulld-frames .mm-ritual header{left:5%;top:9%}
#mulld-frames .mm-ritual b{font-size:3.6cqw}
#mulld-frames .mm-ritual h2{font-size:8cqw;margin-top:1.4cqw}
#mulld-frames .mm-ritual .mm-grid{left:24%;top:16%;opacity:.65;mask-image:linear-gradient(90deg,transparent,#000 60%)}
#mulld-frames .mm-ritual .mm-real{width:170%;bottom:-5%}
#mulld-frames .mm-ritual .mm-pawn{width:21%;left:7%;bottom:9%}
#mulld-frames .mm-ritual small{bottom:5%;left:6%}
</style>
<style>
#mulld-frames .mf-frame{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;container-type:inline-size;background:#101416;--frame-accent:#bda678}
#mulld-frames .mf-art{position:absolute;inset:0}
#mulld-frames .mf-art .mm-cover{width:100%;height:100%;aspect-ratio:auto}
#mulld-frames .mf-trim{position:absolute;pointer-events:none;z-index:6}
#mulld-frames .mf-label,#mulld-frames .mf-footer{position:absolute;z-index:7;font:400 .9cqw/1 Arial;letter-spacing:.17cqw;color:var(--frame-accent)}
#mulld-frames .mf-hairline .mf-art{inset:1.5%}
#mulld-frames .mf-hairline .mf-trim{inset:2.7%;border:1px solid var(--frame-accent);border-radius:.35cqw}
#mulld-frames .mf-hairline .mm-cover small{bottom:4%}
#mulld-frames .mf-cinema{background:#090b0c}
#mulld-frames .mf-cinema .mf-art{inset:8.5% 0}
#mulld-frames .mf-cinema .mf-trim{inset:8.5% 0;border-top:1px solid #a58c5d80;border-bottom:1px solid #a58c5d80}
#mulld-frames .mf-cinema .mf-label{left:4%;top:3.6%;font-size:.8cqw}
#mulld-frames .mf-cinema .mf-footer{bottom:3.5%;right:4%;font-size:.8cqw}
#mulld-frames .mf-cinema .mm-cover small{visibility:hidden}
#mulld-frames .mf-cinema .mm-pawn{width:26%}
#mulld-frames .mf-gallery{background:#e6e1d6}
#mulld-frames .mf-gallery .mf-art{inset:3% 2.2% 10%;box-shadow:0 0 0 1px #fff8}
#mulld-frames .mf-gallery .mf-label{bottom:3.1%;left:3%;font:700 1.8cqw/1 Arial;letter-spacing:-.08cqw;color:#2e3533}
#mulld-frames .mf-gallery .mf-footer{right:3%;bottom:3.6%;font-size:.8cqw;color:#535b56}
#mulld-frames .mf-gallery .mm-cover small{visibility:hidden}
#mulld-frames .mf-corners .mf-art{inset:2%}
#mulld-frames .mf-corners .mf-trim{inset:2%;background:linear-gradient(var(--frame-accent),var(--frame-accent)) left top/7% 2px no-repeat,linear-gradient(var(--frame-accent),var(--frame-accent)) left top/2px 12% no-repeat,linear-gradient(var(--frame-accent),var(--frame-accent)) right top/7% 2px no-repeat,linear-gradient(var(--frame-accent),var(--frame-accent)) right top/2px 12% no-repeat,linear-gradient(var(--frame-accent),var(--frame-accent)) left bottom/7% 2px no-repeat,linear-gradient(var(--frame-accent),var(--frame-accent)) left bottom/2px 12% no-repeat,linear-gradient(var(--frame-accent),var(--frame-accent)) right bottom/7% 2px no-repeat,linear-gradient(var(--frame-accent),var(--frame-accent)) right bottom/2px 12% no-repeat}
#mulld-frames .mf-binding{background:#402326}
#mulld-frames .mf-binding .mf-art{inset:1.7% 1% 1.7% 5%}
#mulld-frames .mf-binding .mf-trim{inset:1.7% 1% 1.7% 5%;border:1px solid #aa8d58}
#mulld-frames .mf-binding .mf-label{left:1.4%;bottom:7%;writing-mode:vertical-rl;transform:rotate(180deg);font:700 1.6cqw/1 Arial;letter-spacing:-.06cqw;color:#dfc99e}
</style>
<style>
#mulld-frames .mf-cinema{background:linear-gradient(135deg,#181a1c,#080a0c 60%)}
#mulld-frames .mf-cinema .mf-art{box-shadow:0 1.2cqw 2.8cqw #0009,0 -.4cqw 1.8cqw #0005}
#mulld-frames .mf-cinema .mm-cover{background:radial-gradient(ellipse at 18% 76%,#60412a 0%,#302820 20%,#171d20 48%,#10171b 100%)}
#mulld-frames .mf-cinema .mm-cover::before{content:"";position:absolute;z-index:1;left:5%;bottom:4%;width:25%;height:8%;background:radial-gradient(ellipse,#080908b3,transparent 70%);filter:blur(.5cqw);transform:rotate(-5deg)}
#mulld-frames .mf-cinema .mm-cover::after{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;background:linear-gradient(180deg,#0000 60%,#070a0d66),radial-gradient(ellipse at 91% 28%,#52677918,transparent 60%);box-shadow:inset 0 1cqw 3cqw #0005}
#mulld-frames .mf-cinema header{text-shadow:0 .35cqw .7cqw #0008}
#mulld-frames .mf-cinema .mm-pawn{filter:drop-shadow(.7cqw .9cqw .7cqw #0008) drop-shadow(-.15cqw -.1cqw .25cqw #e1b57c15)}
#mulld-frames .mf-cinema .mm-grid{opacity:.82;mask-image:linear-gradient(90deg,transparent,#000 43%)}
#mulld-frames .mf-cinema .mf-trim{border-top-color:#d6b77c80;border-bottom-color:#8c744e60;box-shadow:0 1px 0 #000}

</style>
<script>
(()=>{const root=document.getElementById('mulld-frames');const template=document.getElementById('mf-original');const screenshot='../screenshots/work-preview.png';const mascot='mascot.png';root.querySelectorAll('.mf-art').forEach(el=>el.append(template.content.cloneNode(true)));root.querySelectorAll('.mm-real').forEach(el=>el.src=screenshot);root.querySelectorAll('.mm-pawn').forEach(el=>el.src=mascot);if(globalThis.Tweak){root.querySelectorAll('.mf-frame').forEach(el=>{const state={accent:'#bda678'};new Tweak({container:el,onChange:()=>el.style.setProperty('--frame-accent',state.accent)}).addColorPicker(state,'accent',{label:'Frame accent'});});}})();
</script>
</body></html>
